name: macOS verification and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: howr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test
        run: swift test
      - name: Build universal release and verify
        env:
          HOWR_BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: scripts/release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: howr-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: howr-${{ github.sha }}
          path: dist
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS
          printf '%s\n' 'Universal app for macOS 14+, Apple silicon and Intel.' '' 'Ad-hoc signed, not Apple-notarized. First launch may require System Settings → Privacy & Security → Open Anyway. No installer disables Gatekeeper.' '' 'Installation and usage: https://github.com/Skheiller/howr#readme' > notes.md
          gh release create "$RELEASE_TAG" Howr-*-universal.zip SHA256SUMS release.json --verify-tag --title "Howr $RELEASE_TAG" --notes-file notes.md
